[package]
name = "influence-cut"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Plan bounded repair of provenance-linked agent state after an input is revoked"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicholas-ruest/influence-cut"
readme = "README.md"
keywords = ["provenance", "agents", "revocation", "replay", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
